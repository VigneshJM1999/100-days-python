<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}The Idea Store{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="antialiased text-gray-800 flex flex-col min-h-screen">

    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="{{ url_for('home') }}" class="text-2xl font-bold text-gray-900">The Idea Store</a>
            <nav class="flex items-center space-x-6">
                <a href="#" class="text-gray-600 hover:text-gray-900 font-medium">Login</a>
                <a href="#" class="ml-4 bg-gray-800 text-white px-4 py-2 rounded-md hover:bg-gray-700 font-medium">Register</a>
                <a href="{{ url_for('cart_view') }}" id="cart-btn" class="relative">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                    </svg>
                    {% if total_items > 0 %}
                    <span id="cart-count" class="absolute -top-2 -right-2 bg-red-600 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center">
                        {{ total_items }}
                    </span>
                    {% endif %}
                </a>
            </nav>
        </div>
    </header>

    <main class="container mx-auto px-4 py-12 flex-grow">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-white mt-12 py-8 border-t">
        <div class="container mx-auto px-4 text-center text-gray-600">
            <p>&copy; 2025 The Idea Store. All Rights Reserved.</p>
        </div>
    </footer>

</body>
</html>
