{% extends "base.html" %}

{% block title %}Products - The Idea Store{% endblock %}

{% block content %}
<h2 class="text-3xl font-bold text-center mb-8">Featured Products</h2>
<div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
    {% for product in products %}
    <div class="bg-white rounded-lg shadow-md overflow-hidden transform hover:scale-105 transition-transform duration-300">
        <img src="{{ product.imageUrl }}" alt="{{ product.name }}" class="w-full h-64 object-cover">
        <div class="p-4">
            <h3 class="font-semibold text-lg">{{ product.name }}</h3>
            <p class="text-gray-600 mt-1">${{ "%.2f"|format(product.price) }}</p>
            <form action="{{ url_for('add_to_cart', product_id=product.id) }}" method="post">
                <button type="submit" class="w-full mt-4 bg-gray-800 text-white py-2 px-4 rounded-md hover:bg-gray-700">
                    Add to Cart
                </button>
            </form>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
