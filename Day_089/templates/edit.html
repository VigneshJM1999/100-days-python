{% extends "base.html" %}

{% block title %}Edit Task{% endblock %}

{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">

      <div class="card" style="border-radius: .75rem; background-color: #eff1f2;">
        <div class="card-body py-4 px-4 px-md-5">

          <h3 class="mb-4 text-center">Edit Task</h3>

          {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
              {% for category, message in messages %}
                <div class="alert alert-{{ category }}" role="alert">
                  {{ message }}
                </div>
              {% endfor %}
            {% endif %}
          {% endwith %}

          <form action="{{ url_for('edit_task', task_id=task.id) }}" method="POST">

            <div class="mb-3">
              <label for="task-description" class="form-label">Task Description</label>
              <input 
                type="text" 
                name="task" 
                id="task-description"
                class="form-control form-control-lg" 
                value="{{ task.task }}" 
                required>
            </div>

            <div class="mb-4">
              <label for="task-date" class="form-label">Due Date</label>
              <input 
                type="date" 
                name="date" 
                id="task-date"
                class="form-control"
                value="{{ task.date.strftime('%Y-%m-%d') if task.date else '' }}">
            </div>

            <div class="d-flex justify-content-center gap-2">
              <button type="submit" class="btn btn-primary">
                <i class="fas fa-save me-2"></i>Update Task
              </button>
              <a href="{{ url_for('home') }}" class="btn btn-secondary">
                <i class="fas fa-times me-2"></i>Cancel
              </a>
            </div>

          </form>
        </div>
      </div>

    </div>
  </div>
</div>
{% endblock %}
