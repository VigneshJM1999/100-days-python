<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Color Extractor</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;max-width:1000px;margin:30px auto;padding:0 20px}
.uploader{border:2px dashed #ddd;padding:24px;border-radius:12px;text-align:center}
.palette{display:flex;gap:8px;margin-top:18px}
.swatch{flex:1;min-width:0;border-radius:6px;padding:12px;color:#111;font-weight:600;text-align:center}
.swatch small{display:block;font-size:12px;font-weight:500;margin-top:8px}
img.uploaded{max-width:100%;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,0.08)}
.meta{margin-top:12px;color:#555}
footer{margin-top:30px;color:#888;font-size:13px}
</style>
</head>
<body>
<h1>Color Extractor</h1>
<p>Upload an image and this tool will show the most common colors in it.</p>


<div class="uploader">
<form method="post" action="/upload" enctype="multipart/form-data">
<input type="file" name="image" accept="image/*" required>
<br><br>
<label>Number of colors: <input type="number" name="num_colors" value="{{num_colors}}" min="1" max="64"></label>
<br><br>
<button type="submit">Upload & Extract</button>
</form>
</div>


<footer>
Tip: increasing the number of colors picks up more subtle shades. This demo uses Pillow's median-cut quantization.
</footer>
</body>
</html>
